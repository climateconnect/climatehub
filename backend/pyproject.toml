requires-python = ">=3.12"
license = { text = "AGPL" }

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.ruff]
extend-exclude = ['*/migrations']
# not sure why, but the pipline does not recognize lint.igore,
# might be due to different ruff versions
# lint.ignore = [
ignore = [
    'E501', # since black does not format all long lines (e.g. comments, disable this lint)
    'F541', # f-strings without placeholder
]

# same here: it can not recognize lint.select (version issues?)
# [tool.ruff.lint.per-file-ignores]

# Ignore `F401` (import violations) in all `__init__.py` files, and in `path/to/file.py`.
[tool.ruff.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.black]
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
# ^/foo.py  # exclude a file named foo.py in the root of the project (in addition to the defaults)
^.*\b(migrations)\b.*$
'''

[tool.coverage.run]
source = [
    "climateconnect_api",
    "climateconnect_main",
    "organization",
    "hubs",
    "ideas",
    "location",
    "translations",
    "chat_messages",
    "feature_toggles",
]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    "climateconnect_main/settings.py",
    "climateconnect_main/wsgi.py",
    "climateconnect_main/asgi.py",
    "manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1

[dependency-groups]
dev = [
    "ruff>=0.0.271",
    "django-debug-toolbar>=3.5.0",
    "coverage[toml]>=7.13.5",
    "deptry>=0.25.1",
    "pre-commit>=3.6.0",
    "tblib>=3.0.0",
]

[tool.deptry]
ignore = ["DEP002"]
package_module_name_map = {djangorestframework = "rest_framework", django-rest-knox = "knox"}
