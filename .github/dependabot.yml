# Weekly dependency upgrades.
#
# Read more about the config here:
# https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/configuration-options-for-dependency-updates#target-branch
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    target-branch: "master"

  # No backend (Python) entry: Dependabot cannot update pdm.lock. Security
  # alerts for the backend come from the backend-dependency-submission
  # workflow instead.

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "sunday"
    target-branch: "master"
    labels:
      - "npm dependencies"
