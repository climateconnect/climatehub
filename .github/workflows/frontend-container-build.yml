# Phase 2F: Build and push a production-ready frontend container image.
#
# This is the frontend equivalent of backend-container-build.yml.
# Manually triggered — run it to build + push an image and optionally
# deploy to a throwaway verification App Service.
#
# IMPORTANT: Build-time env vars are embedded into the client bundle
# (see next.config.js `env` block).  Until Phase 5 moves them to runtime,
# images MUST be kept private in the registry.

name: Build frontend container image

on:
  workflow_dispatch:
    inputs:
      deploy_verify:
        description: 'Deploy to verification App Service after push'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha-tag: ${{ steps.sha.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set build timestamp
        id: timestamp
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Compute short SHA
        id: sha
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend-production.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_TIME=${{ steps.timestamp.outputs.value }}
            BUILD_SHA=${{ github.sha }}
            BUILD_TIMESTAMP=${{ steps.timestamp.outputs.value }}
            API_HOST=${{ secrets.API_HOST }}
            API_URL=${{ secrets.API_URL }}
            BASE_URL=${{ secrets.BASE_URL }}
            BASE_URL_HOST=${{ secrets.BASE_URL_HOST }}
            CLIMATEORG_ACTIVE=${{ secrets.CLIMATEORG_ACTIVE }}
            CUSTOM_HUB_URLS=${{ secrets.CUSTOM_HUB_URLS }}
            DONATION_CAMPAIGN_RUNNING=${{ secrets.DONATION_CAMPAIGN_RUNNING }}
            ENVIRONMENT=production
            FRONTEND_SENTRY_DSN=${{ secrets.FRONTEND_SENTRY_DSN }}
            GOOGLE_ANALYTICS_CODE=${{ secrets.GOOGLE_ANALYTICS_CODE }}
            LATEST_NEWSLETTER_LINK=${{ secrets.LATEST_NEWSLETTER_LINK }}
            LETS_ENCRYPT_FILE_CONTENT=${{ secrets.LETS_ENCRYPT_FILE_CONTENT }}
            LOCATION_HUBS=${{ secrets.LOCATION_HUBS }}
            SOCKET_URL=${{ secrets.SOCKET_URL }}
            WASSERAKTIONSWOCHEN_FEATURE=${{ secrets.WASSERAKTIONSWOCHEN_FEATURE }}
            WEBFLOW_API_TOKEN=${{ secrets.WEBFLOW_API_TOKEN }}
            WEBFLOW_SITE_ID=${{ secrets.WEBFLOW_SITE_ID }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image reference
        run: |
          echo "Pushed image:"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.tag }}"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

  verify:
    runs-on: ubuntu-latest
    needs: build
    if: inputs.deploy_verify
    environment: slot2
    permissions:
      id-token: write
      contents: read
    env:
      # TODO: Replace with actual Azure App Service names for the frontend
      # container verification target.  These follow the backend convention
      # (climateconnect-frontend-container / climate-connect-frontend RG).
      APP_NAME: climateconnect-frontend-container
      RESOURCE_GROUP: climate-connect-frontend
      SLOT: slot2
      SLOT_URL: climateconnect-frontend-container-slot2.azurewebsites.net
    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4872F38E7EC34E84A6DC4282AD368DAE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_03DE6874FBFC4E709867040CB9136FD8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_127807AFF9E54FB49F85724A33EB8088 }}

      - name: Set container image on slot2
        run: |
          az webapp config container set \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --slot "$SLOT" \
            --container-image-name "$IMAGE_REF"
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.sha-tag }}

      - name: Configure container port
        run: |
          az webapp config appsettings set \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --slot "$SLOT" \
            --settings WEBSITES_PORT=3000 \
            --output none

      - name: Restart slot2
        run: |
          az webapp restart \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --slot "$SLOT"

      - name: Wait for cold start
        run: sleep 45

      - name: Health check — GET /
        run: |
          echo "GET https://${SLOT_URL}/"
          curl -sf --retry 5 --retry-delay 10 \
            "https://${SLOT_URL}/"

      - name: Print next steps
        run: |
          echo ""
          echo "=== Slot2 verified ==="
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.sha-tag }}"
          echo "Slot2: https://${SLOT_URL}"
          echo ""
          echo "To swap to production, run:"
          echo "  az webapp deployment slot swap \\"
          echo "    --name $APP_NAME \\"
          echo "    --resource-group $RESOURCE_GROUP \\"
          echo "    --slot $SLOT \\"
          echo "    --action swap"
