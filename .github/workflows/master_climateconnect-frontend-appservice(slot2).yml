# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Production frontend app service

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'doc/**'
      - '.github/agents/**'
      - '*.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - 'GLOSSARY.md'
      - 'AGENTS.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: 'slot2'
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js version
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Cache node modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: yarn install, webflow devlink export and build
        run: |
          cd frontend
          corepack enable
          yarn install --immutable
          yarn devlink-sync
          yarn build
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          API_HOST: ${{ secrets.API_HOST }}
          CUSTOM_HUB_URLS: ${{ secrets.CUSTOM_HUB_URLS }}
          API_URL: ${{ secrets.API_URL }}
          BASE_URL_HOST: ${{ secrets.BASE_URL_HOST }}
          BASE_URL: ${{ secrets.BASE_URL }}
          DONATION_CAMPAIGN_RUNNING: ${{ secrets.DONATION_CAMPAIGN_RUNNING }}
          ENVIRONMENT: 'production'
          GOOGLE_ANALYTICS_CODE: ${{ secrets.GOOGLE_ANALYTICS_CODE }}
          LATEST_NEWSLETTER_LINK: ${{ secrets.LATEST_NEWSLETTER_LINK }}
          LETS_ENCRYPT_FILE_CONTENT: ${{ secrets.LETS_ENCRYPT_FILE_CONTENT }}
          LOCATION_HUBS: ${{ secrets.LOCATION_HUBS }}
          SOCKET_URL: ${{ secrets.SOCKET_URL }}
          WASSERAKTIONSWOCHEN_FEATURE: ${{ secrets.WASSERAKTIONSWOCHEN_FEATURE }}
          CLIMATEORG_ACTIVE: ${{ secrets.CLIMATEORG_ACTIVE }}
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
          WEBFLOW_SITE_ID: ${{ secrets.WEBFLOW_SITE_ID}}
          FRONTEND_SENTRY_DSN: ${{ secrets.FRONTEND_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Write build env
        run: |
          echo '{
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref_name }}",
            "built_at": "${{ github.event.head_commit.timestamp }}",
            "API_HOST": "${{ secrets.API_HOST }}",
            "API_URL": "${{ secrets.API_URL }}",
            "BASE_URL": "${{ secrets.BASE_URL }}",
            "BASE_URL_HOST": "${{ secrets.BASE_URL_HOST }}",
            "CLIMATEORG_ACTIVE": "${{ secrets.CLIMATEORG_ACTIVE }}",
            "CUSTOM_HUB_URLS": "${{ secrets.CUSTOM_HUB_URLS }}",
            "DONATION_CAMPAIGN_RUNNING": "${{ secrets.DONATION_CAMPAIGN_RUNNING }}",
            "FRONTEND_SENTRY_DSN": "${{ secrets.FRONTEND_SENTRY_DSN }}",
            "GOOGLE_ANALYTICS_CODE": "${{ secrets.GOOGLE_ANALYTICS_CODE }}",
            "LATEST_NEWSLETTER_LINK": "${{ secrets.LATEST_NEWSLETTER_LINK }}",
            "LETS_ENCRYPT_FILE_CONTENT": "${{ secrets.LETS_ENCRYPT_FILE_CONTENT }}",
            "LOCATION_HUBS": "${{ secrets.LOCATION_HUBS }}",
            "SOCKET_URL": "${{ secrets.SOCKET_URL }}",
            "WASSERAKTIONSWOCHEN_FEATURE": "${{ secrets.WASSERAKTIONSWOCHEN_FEATURE }}",
            "WEBFLOW_SITE_ID": "${{ secrets.WEBFLOW_SITE_ID }}"
          }' > frontend/build_info.json

      # Ship only the standalone output (traced runtime files) instead of the
      # full frontend/ with node_modules. Next leaves public/ and .next/static
      # out of the standalone folder, so they are copied in here. The standalone
      # folder may already contain traced files under public/, so merge the
      # directory contents ("dir/.") instead of copying the directory itself.
      - name: Assemble standalone package
        run: |
          mkdir release
          cp -R frontend/.next/standalone release/frontend
          mkdir -p release/frontend/public release/frontend/.next/static
          cp -R frontend/public/. release/frontend/public/
          cp -R frontend/.next/static/. release/frontend/.next/static/
          cp frontend/build_info.json release/frontend/

      # The file tracer can miss modules (e.g. "module-sync" exports) or files
      # read at runtime, which only shows up when a page renders, so render a
      # few pages before shipping.
      - name: Smoke test standalone server
        run: |
          cd release/frontend
          PORT=3000 HOSTNAME=127.0.0.1 node server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          # Fail if public/ or .next/static did not end up where the server expects them
          curl -sf -o /dev/null http://127.0.0.1:3000/robots.txt
          main_js=$(ls .next/static/chunks | grep -m1 '^main-')
          curl -sf -o /dev/null "http://127.0.0.1:3000/_next/static/chunks/$main_js"
          for p in / /de /browse /about; do
            curl -s -o /dev/null -w "%{http_code} $p\n" "http://127.0.0.1:3000$p"
          done
          kill %1
          cat "$RUNNER_TEMP/server.log"
          ! grep -E "Cannot find module|MODULE_NOT_FOUND|ENOENT" "$RUNNER_TEMP/server.log"

      - name: Zip artifact for deployment
        run: cd release && zip -qr ../release.zip frontend/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'slot2'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip -q release.zip && rm release.zip

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4872F38E7EC34E84A6DC4282AD368DAE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_03DE6874FBFC4E709867040CB9136FD8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_127807AFF9E54FB49F85724A33EB8088 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'climateconnect-frontend-appservice'
          slot-name: 'slot2'
          package: .
          clean: true
